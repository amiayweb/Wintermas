name: Release Wintermas

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wintermas-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already tagged
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'package.json must specify a stable version such as 0.1.0.'
          }

          $tag = "v$version"
          git ls-remote --exit-code --refs origin "refs/tags/$tag"
          switch ($LASTEXITCODE) {
            0 {
              Write-Host "$tag already exists. Skipping the build."
              'build=false' >> $env:GITHUB_OUTPUT
            }
            2 {
              'build=true' >> $env:GITHUB_OUTPUT
              "tag=$tag" >> $env:GITHUB_OUTPUT
            }
            default { throw 'Could not check tags on origin.' }
          }
          exit 0

      - uses: actions/setup-node@v4
        if: steps.version.outputs.build == 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install build dependencies
        if: steps.version.outputs.build == 'true'
        run: |
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd exec -- install-electron

      - name: Build the Windows installer
        if: steps.version.outputs.build == 'true'
        run: npm.cmd run build

      - name: Publish the installer
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG 'dist/setup/Wintermas-Setup.exe' --target $env:GITHUB_SHA --title "Wintermas $env:RELEASE_TAG" --generate-notes
